name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; the release job below raises this for itself only.
# The workflow pins third-party actions to commit SHAs (the tag is in the
# comment) so a moved tag cannot change what runs with the release token.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --check
      # Runs on Linux, so this covers the bluer GATT path that never
      # compiles on macOS dev machines.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Deliberately after the tests, and deliberately not --all-targets: this
      # is the only step that builds without dev-dependencies. The manifest
      # declares `tokio` with a trimmed feature list, and a dev-dependency
      # (`test-util`, or a test-only crate's own tokio features) can re-enable
      # a feature. Only this step reveals a feature that the binary needs
      # before a release build on the Pi.
      - run: cargo build
      # The only step that exercises the release profile. Its fat LTO and
      # codegen-units = 1 can cause link errors that a debug build never
      # reaches. Slow, but cheaper than a failed deploy.
      - run: cargo build --release

  # Only a dev Mac otherwise compiles the `not(target_os = "linux")` half of
  # the crate: the btleplug scanner and the platform stubs. A defect there
  # stays silent. Not a required check: a macOS runner is slower to queue.
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: macos
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Builds the release binaries and publishes them as one GitHub Release. A
  # deploy then never depends on the working tree of the dev machine, and a
  # rollback is a download of an earlier tag. One build job per target, then
  # a single release job: parallel jobs that each call the release action
  # would race to create the same tag.
  build:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target:
          - arm-unknown-linux-musleabihf   # Pi Zero / 1 / 2 (32-bit ARMv6)
          - aarch64-unknown-linux-musl     # Pi 3/4/5 on a 64-bit OS
          - x86_64-unknown-linux-musl      # PCs and VMs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Must precede the build: cross writes this value into the binary. The
      # value comes from the commit and the date, so every matrix job
      # computes the same value.
      - name: Compute build version
        run: echo "BUILD_VERSION=$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # cross runs the *host* rustup toolchain inside its container (it mounts
      # the sysroot read-only), so this toolchain compiles edition 2024.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # cross mounts the host CARGO_HOME and ./target into the container, so
      # container builds do populate the directories this caches. cache-bin is
      # off so it does not conflict with install-action over
      # ~/.cargo/bin/cross.
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.target }}
          cache-bin: false

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cross

      # No CROSS_CONTAINER_OPTS here: deploy.sh needs --platform linux/amd64
      # only because the dev Mac is arm64 and the cross images are amd64-only.
      # ubuntu-latest is already x64, so it would be a no-op.
      - name: Cross-build static musl binary
        run: cross build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          BIN="m3i-ha-bridge-${BUILD_VERSION}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/m3i-ha-bridge" "$BIN"
          sha256sum "$BIN" > "$BIN.sha256"
          file "$BIN"
          # If this prints "dev", Cross.toml's build.env.passthrough does not
          # reach the container, and every release is unidentifiable.
          strings "$BIN" | grep -qF "$BUILD_VERSION" \
            || { echo "::error::BUILD_VERSION was not baked into the binary"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: m3i-ha-bridge-*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    # The release needs write access; the scope is this job only, so every
    # other job keeps the workflow-level read-only token.
    permissions:
      contents: write
    steps:
      # Only for OSMFEULA.txt. It ships with the binaries because the
      # Maintenance Fee terms apply to the Binary Release, not the source.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: OSMFEULA.txt
          sparse-checkout-cone-mode: false

      - name: Compute build version
        run: echo "BUILD_VERSION=$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          merge-multiple: true

      # A build that spans midnight UTC has a stale date in the artifact
      # names; the step refuses to publish rather than create a wrong tag.
      - name: Check every artifact carries this version
        run: |
          ls -l
          for f in m3i-ha-bridge-*; do
            case "$f" in m3i-ha-bridge-${BUILD_VERSION}-*) ;; *)
              echo "::error::$f does not match BUILD_VERSION=$BUILD_VERSION"; exit 1;;
            esac
          done

      - uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ env.BUILD_VERSION }}
          # Pin the tag to the commit that was actually built, rather than
          # whatever the branch tip happens to be when the API call lands.
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          # One pattern per asset, with no overlap. The trailing * matches
          # both the arm "eabihf" suffix and every ".sha256" file. A second
          # pattern that matches the same files makes the action upload each
          # of them twice, concurrently. The duplicate uploads race, and one
          # fails with a 404 from the update-asset endpoint (issue #48).
          files: |
            m3i-ha-bridge-*-unknown-linux-musl*
            OSMFEULA.txt

  # Verifies `rust-version` in Cargo.toml. Without this job the field is a
  # guess: the crate builds on stable whether the real minimum is 1.85 or
  # 1.88. Only a compile on the declared version proves the claim.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: msrv
      - run: cargo check --all-targets
